[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[general]
import = ["/home/marco/.config/alacritty/themes/tokyo-night.toml"]

[window]
#opacity = 0.95
startup_mode = "Maximized"

[window.dimensions]
columns = 100
lines = 25

[window.padding]
x = 8
y = 8

[cursor]
blink_timeout = 0

[cursor.style]
shape = "Block"
blinking = "On"
